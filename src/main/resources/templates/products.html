<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Product AJAX</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><nav><a href="/ajax/categories">Category</a> | <a href="/ajax/products">Product</a></nav><h1>Quản lý Product</h1><div id="notice"></div><input id="search" class="form-control mb-2" placeholder="Tìm Product"><form id="form" class="row g-2"><input type="hidden" name="productId"><input class="form-control col" name="productName" placeholder="Tên" required><input class="form-control col" name="quantity" type="number" min="0" placeholder="Số lượng" required><input class="form-control col" name="unitPrice" type="number" min="0" step=".01" placeholder="Giá" required><input class="form-control col" name="discount" type="number" min="0" max="100" step=".01" value="0"><select class="form-select col" name="status"><option value="1">Hoạt động</option><option value="0">Ẩn</option></select><select class="form-select col" name="categoryId"></select><input class="form-control col" name="imageFile" type="file" accept="image/*"><textarea class="form-control" name="description" placeholder="Mô tả" required></textarea><button class="btn btn-primary">Lưu</button></form><table class="table mt-3"><thead><tr><th>Ảnh</th><th>Tên</th><th>Category</th><th>Giá</th><th>SL</th><th>Thao tác</th></tr></thead><tbody></tbody></table><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="/js/product.js"></script></body></html>
