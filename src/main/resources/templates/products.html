<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Rest API AJAX</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; border: none; }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .btn-custom { border-radius: 8px; font-weight: 500; }
        .price-text { color: #28a745; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-store me-2"></i>Admin Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fa-solid fa-list me-1"></i> Quản lý Danh mục</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/products"><i class="fa-solid fa-box-open me-1"></i> Quản lý Sản phẩm</a>
                    </li>
                </ul>
                <a href="/swagger-ui.html" target="_blank" class="btn btn-outline-light btn-sm rounded-pill">
                    <i class="fa-solid fa-code me-1"></i> Swagger API
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Alert Notification -->
        <div id="alertBox" class="alert alert-dismissible fade show d-none" role="alert">
            <span id="alertMessage"></span>
            <button type="button" class="btn-close" onclick="$('#alertBox').addClass('d-none')"></button>
        </div>

        <div class="row g-4">
            <!-- Form nhập dữ liệu -->
            <div class="col-lg-4">
                <div class="card shadow-sm p-4">
                    <h5 class="card-title fw-bold text-success mb-3" id="formTitle">
                        <i class="fa-solid fa-plus-circle me-2"></i>Thêm Sản Phẩm
                    </h5>
                    <form id="productForm">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" id="prodName" class="form-control" placeholder="Nhập tên sản phẩm..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" step="1000" id="prodPrice" class="form-control" placeholder="0" required>
                                <span class="input-group-text">đ</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">URL Hình ảnh</label>
                            <input type="text" id="prodImage" class="form-control" placeholder="https://example.com/product.jpg">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                            <select id="prodCategory" class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-success btn-custom" onclick="saveProduct()">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu sản phẩm
                            </button>
                            <button type="button" class="btn btn-light btn-custom text-secondary" onclick="resetForm()">
                                <i class="fa-solid fa-rotate-left me-1"></i> Làm mới
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bảng Danh sách -->
            <div class="col-lg-8">
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title fw-bold text-dark m-0"><i class="fa-solid fa-boxes-stacked me-2"></i>Danh Sách Sản Phẩm</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadProducts()">
                            <i class="fa-solid fa-arrows-rotate me-1"></i> Tải lại
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 70px;">ID</th>
                                    <th style="width: 80px;">Hình ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Giá</th>
                                    <th>Danh mục</th>
                                    <th class="text-center" style="width: 130px;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="productTable">
                                <!-- Data AJAX Render -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_PRODUCT = '/api/v1/products';
        const API_CATEGORY = '/api/v1/categories';
        let categoriesMap = {};

        function showAlert(msg, type = 'success') {
            $('#alertMessage').text(msg);
            $('#alertBox').removeClass('d-none alert-success alert-danger').addClass(`alert-${type}`);
            setTimeout(() => $('#alertBox').addClass('d-none'), 3000);
        }

        function loadCategoriesSelect() {
            $.get(API_CATEGORY, function(data) {
                let options = '<option value="">-- Chọn danh mục --</option>';
                categoriesMap = {};
                data.forEach(cat => {
                    categoriesMap[cat.id] = cat.name;
                    options += `<option value="${cat.id}">${cat.name}</option>`;
                });
                $('#prodCategory').html(options);
            });
        }

        function loadProducts() {
            $.get(API_PRODUCT, function(data) {
                let html = '';
                if(data.length === 0) {
                    html = `<tr><td colspan="6" class="text-center text-muted py-4"><i class="fa-regular fa-folder-open fs-3 d-block mb-2"></i>Chưa có sản phẩm nào</td></tr>`;
                } else {
                    data.forEach(item => {
                        const imgTag = item.image ? `<img src="${item.image}" class="product-img" onerror="this.src='https://via.placeholder.com/50?text=No+Img'" alt="img">` : '<span class="badge bg-secondary">Không ảnh</span>';
                        const categoryName = categoriesMap[item.categoryId] || `ID: ${item.categoryId || 'N/A'}`;
                        const formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.price || 0);

                        html += `<tr>
                            <td class="fw-bold text-secondary">#${item.id}</td>
                            <td>${imgTag}</td>
                            <td class="fw-semibold text-dark">${item.name}</td>
                            <td class="price-text">${formattedPrice}</td>
                            <td><span class="badge bg-info text-dark">${categoryName}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-warning me-1" onclick="editProduct(${item.id}, '${item.name}', ${item.price || 0}, '${item.image || ''}', ${item.categoryId || 'null'})" title="Sửa">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${item.id})" title="Xóa">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>`;
                    });
                }
                $('#productTable').html(html);
            }).fail(function() {
                showAlert('Không thể tải danh sách sản phẩm!', 'danger');
            });
        }

        function saveProduct() {
            const name = $('#prodName').val().trim();
            const price = parseFloat($('#prodPrice').val());
            const categoryId = $('#prodCategory').val();

            if (!name || isNaN(price) || !categoryId) {
                showAlert('Vui lòng điền đầy đủ thông tin bắt buộc!', 'danger');
                return;
            }

            const id = $('#prodId').val();
            const data = {
                name: name,
                price: price,
                image: $('#prodImage').val().trim(),
                categoryId: parseInt(categoryId)
            };

            const type = id ? 'PUT' : 'POST';
            const url = id ? `${API_PRODUCT}/${id}` : API_PRODUCT;

            $.ajax({
                url: url,
                type: type,
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function() {
                    showAlert(id ? 'Cập nhật sản phẩm thành công!' : 'Thêm mới sản phẩm thành công!');
                    resetForm();
                    loadProducts();
                },
                error: function() {
                    showAlert('Lưu thất bại. Vui lòng kiểm tra lại dữ liệu!', 'danger');
                }
            });
        }

        function editProduct(id, name, price, image, categoryId) {
            $('#prodId').val(id);
            $('#prodName').val(name);
            $('#prodPrice').val(price);
            $('#prodImage').val(image);
            $('#prodCategory').val(categoryId);
            $('#formTitle').html('<i class="fa-solid fa-pen-to-square me-2"></i>Cập Nhật Sản Phẩm');
        }

        function deleteProduct(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                $.ajax({
                    url: `${API_PRODUCT}/${id}`,
                    type: 'DELETE',
                    success: function() {
                        showAlert('Đã xóa sản phẩm thành công!');
                        loadProducts();
                    },
                    error: function() {
                        showAlert('Xóa không thành công!', 'danger');
                    }
                });
            }
        }

        function resetForm() {
            $('#prodId').val('');
            $('#prodName').val('');
            $('#prodPrice').val('');
            $('#prodImage').val('');
            $('#prodCategory').val('');
            $('#formTitle').html('<i class="fa-solid fa-plus-circle me-2"></i>Thêm Sản Phẩm');
        }

        $(document).ready(function() {
            loadCategoriesSelect();
            loadProducts();
        });
    </script>
</body>
</html>
